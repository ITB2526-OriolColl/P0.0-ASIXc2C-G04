# /etc/netplan/01-network-manager-all.yaml  (R-N04)
network:
  version: 2
  renderer: networkd
  ethernets:
    enp1s0:
      dhcp4: true   # WAN / NAT (Internet)
    enp2s0:
      dhcp4: true   # VPN WireGuard Isard
    enp3s0:
      dhcp4: false
      addresses:
        - 10.4.20.1/24  # Gateway INTRANET
    enp4s0:
      dhcp4: false
      addresses:
        - 10.4.10.1/24  # Gateway DMZ
