# /etc/vsftpd.conf  (F-N04)
# Líneas añadidas al final del archivo original de Ubuntu.
# El original completo se guardó en /etc/vsftpd.conf.backup
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
pasv_min_port=40000
pasv_max_port=40100
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO
